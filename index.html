    <title>ماليدا شوره ش - بحث الأسماء والأكواد</title>
    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            animation: slideDown 0.6s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }
        
        .search-wrapper {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .search-section {
            margin-bottom: 25px;
        }
        
        .search-box {
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }
        
        .search-box input::placeholder {
            color: #999;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
            transition: transform 0.3s ease;
        }
        
        .stat-box:hover {
            transform: translateY(-5px);
        }
        
        .stat-box span {
            font-weight: bold;
            font-size: 2em;
            display: block;
            margin-bottom: 5px;
        }
        
        .stat-box p {
            font-size: 0.9em;
            opacity: 0.95;
        }
        
        .results-section {
            margin-top: 30px;
        }
        
        .results-header {
            background: white;
            border-radius: 15px 15px 0 0;
            padding: 20px 25px;
            border-bottom: 3px solid #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .results-header h2 {
            font-size: 1.4em;
            color: #333;
        }
        
        .results-container {
            background: white;
            border-radius: 0 0 15px 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            min-height: 200px;
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        th {
            padding: 15px;
            text-align: right;
            font-weight: 600;
            border-bottom: 3px solid #667eea;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        tbody tr {
            transition: all 0.3s ease;
        }
        
        tbody tr:hover {
            background: #f8f9fa;
            box-shadow: 0 2px 5px rgba(102, 126, 234, 0.2);
        }
        
        .match-percentage {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
            min-width: 60px;
            text-align: center;
        }
        
        .match-100 {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        }
        
        .match-50 {
            background: linear-gradient(135deg, #ffc107 0%, #ff9800 100%);
        }
        
        .code-badge {
            background: #e7f3ff;
            color: #0066cc;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            border: 2px solid #0066cc;
        }
        
        .ampere-badge {
            background: #fff3cd;
            color: #856404;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            border: 2px solid #ffc107;
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.1em;
        }
        
        .highlight {
            background-color: #ffd700;
            padding: 2px 6px;
            border-radius: 4px;
            color: #333;
            font-weight: bold;
        }
        
        .install-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            display: none;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }
        
        .install-button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
        }
        
        .install-button.show {
            display: block;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .search-wrapper {
                padding: 20px;
            }
            
            .results-container {
                padding: 20px;
            }
            
            th, td {
                padding: 10px;
                font-size: 0.9em;
            }
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5em;
            }

                padding: 15px;
            }

                grid-template-columns: 1fr;
            }
            
            .results-container {
                padding: 15px;
            }
            
            th, td {
                padding: 8px;
                font-size: 0.85em;
            }
            
            .stat-box span {
                font-size: 1.5em;
            }
        }
    </style>
</head>

        // دالة تسليط الضوء على البحث
        function highlightSearch(text, search) {
            if (!search) return text;
            const regex = new RegExp(`(${search})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // عرض إجمالي المشتركين عند تحميل الصفحة
        document.getElementById('totalCount').textContent = subscribers.length;

        // حدث البحث
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const searchTerm = this.value.trim();
            
            if (!searchTerm) {
                document.getElementById('resultsContainer').innerHTML = `
                    <div class="no-results">
                        <div style="font-size: 2.5em; margin-bottom: 10px;">🔎</div>
                        <div>ابدأ البحث بكتابة اسم أو كود</div>
                    </div>
                `;
                document.getElementById('resultCount').textContent = '0';
                document.getElementById('matchPercentage').textContent = '0%';
                return;
            }

            // البحث
            let results = [];
            
            subscribers.forEach(subscriber => {
                // تحقق من تطابق الاسم أو الكود أو الأمبير
                if (subscriber.name.includes(searchTerm) || subscriber.code.includes(searchTerm) || subscriber.ampere.includes(searchTerm)) {
                    // حساب نسبة المطابقة
                    let matchPercentage = 0;
                    
                    // مطابقة دقيقة للاسم الكامل
                    if (subscriber.name === searchTerm) {
                        matchPercentage = 100;
                    }
                    // مطابقة دقيقة للكود
                    else if (subscriber.code === searchTerm) {
                        matchPercentage = 100;
                    }
                    // مطابقة دقيقة للأمبير
                    else if (subscriber.ampere === searchTerm) {
                        matchPercentage = 100;
                    }
                    // مطابقة جزئية للاسم
                    else if (subscriber.name.includes(searchTerm)) {
                        matchPercentage = Math.round((searchTerm.length / subscriber.name.length) * 100);
                    }
                    // مطابقة جزئية للكود
                    else if (subscriber.code.includes(searchTerm)) {
                        matchPercentage = 75;
                    }
                    // مطابقة جزئية للأمبير
                    else if (subscriber.ampere.includes(searchTerm)) {
                        matchPercentage = 50;
                    }
                    
                    results.push({
                        ...subscriber,
                        matchPercentage: matchPercentage
                    });
                }
            });

            // ترتيب النتائج بناءً على نسبة المطابقة
            results.sort((a, b) => b.matchPercentage - a.matchPercentage);

            // عرض النتائج
            if (results.length > 0) {
                let tableHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>اسم المشترك</th>
                                <th>الكود</th>
                                <th>الأمبير</th>
                                <th>دقة المطابقة</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                results.forEach(result => {
                    let matchClass = result.matchPercentage === 100 ? 'match-100' : (result.matchPercentage >= 50 ? 'match-50' : '');
                    tableHTML += `
                        <tr>
                            <td>${highlightSearch(result.name, searchTerm)}</td>
                            <td><span class="code-badge">${result.code}</span></td>
                            <td><span class="ampere-badge">${result.ampere}</span></td>
                            <td><span class="match-percentage ${matchClass}">${result.matchPercentage}%</span></td>
                        </tr>
                    `;
                });
                
                tableHTML += `
                        </tbody>
                    </table>
                `;
                
                document.getElementById('resultsContainer').innerHTML = tableHTML;
                document.getElementById('resultCount').textContent = results.length;
                
                // متوسط نسبة المطابقة
                const avgMatch = Math.round(results.reduce((sum, r) => sum + r.matchPercentage, 0) / results.length);
                document.getElementById('matchPercentage').textContent = avgMatch + '%';
            } else {
                document.getElementById('resultsContainer').innerHTML = `
                    <div class="no-results">
                        <div style="font-size: 2.5em; margin-bottom: 10px;">❌</div>
                        <div>لم تُعثر على نتائج للبحث</div>
                    </div>
                `;
                document.getElementById('resultCount').textContent = '0';
                document.getElementById('matchPercentage').textContent = '0%';
            }
        });

        // PWA Install Button Handler
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.add('show');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`التطبيق ${outcome === 'accepted' ? 'مثبت بنجاح' : 'لم يتم تثبيته'}`);
                deferredPrompt = null;
                document.getElementById('installBtn').classList.remove('show');
            }
        });

        // Handle app installed event
        window.addEventListener('appinstalled', () => {
            console.log('تم تثبيت التطبيق بنجاح');
            document.getElementById('installBtn').classList.remove('show');
        });
    </script>
